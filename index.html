<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wishlist</title>
<style>
  :root{
    --bg:#f5f4f1; --card:#ffffff; --ink:#1c1b19; --sub:#6b6862; --line:#e4e1da;
    --accent:#b5502b; --accent-ink:#fff; --chip:#efece5; --danger:#b3261e; --ok:#2f7a3d;
    --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#171614; --card:#221f1c; --ink:#f2efe9; --sub:#a39d92; --line:#332f2a;
      --accent:#e08556; --accent-ink:#1c1b19; --chip:#2c2823; --danger:#ff6b60; --ok:#5fd47a;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 20px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
  header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 16px calc(10px + env(safe-area-inset-top,0)) 16px;}
  header .row{display:flex;align-items:center;gap:10px;}
  header h1{font-size:19px;margin:0;flex:1;letter-spacing:-.01em;}
  header h1 span{color:var(--sub);font-weight:500;}
  .icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;color:var(--ink);flex:none;}
  .icon-btn:active{transform:scale(.95);}
  .search{margin-top:10px;}
  .search input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;}
  main{padding:14px 16px 110px 16px;max-width:960px;margin:0 auto;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative;transition:opacity .15s;}
  .card.off{opacity:.5;}
  .card .photo{aspect-ratio:1/1;background:var(--chip) center/cover no-repeat;position:relative;cursor:pointer;}
  .card .photo.empty::after{content:"🛍️";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px;opacity:.4;}
  .card .toggle-wrap{position:absolute;top:8px;left:8px;z-index:2;}
  .card .toggle-wrap input{width:22px;height:22px;accent-color:var(--accent);cursor:pointer;}
  .card .body{padding:10px 12px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1;}
  .card .name{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3;min-height:1.3em;}
  .card .price{font-size:16px;font-weight:700;color:var(--accent);}
  .card .link{font-size:12px;color:var(--sub);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card-actions{display:flex;gap:6px;margin-top:auto;padding-top:6px;}
  .card-actions button{flex:1;padding:7px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:12.5px;cursor:pointer;}
  .card-actions button.danger{color:var(--danger);border-color:var(--danger);}
  .empty-state{text-align:center;padding:60px 20px;color:var(--sub);}
  .empty-state .big{font-size:40px;margin-bottom:10px;}
  .fab{position:fixed;right:18px;bottom:calc(90px + env(safe-area-inset-bottom,0));width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:none;font-size:28px;box-shadow:var(--shadow);cursor:pointer;z-index:30;}
  .fab:active{transform:scale(.94);}
  .totalbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0)) 16px;z-index:25;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .totalbar .label{font-size:12.5px;color:var(--sub);}
  .totalbar .amount{font-size:20px;font-weight:700;}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
  @media (min-width:640px){.overlay{align-items:center;}}
  .sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0)) 16px;}
  @media (min-width:640px){.sheet{border-radius:18px;max-height:85vh;}}
  .sheet h2{margin:2px 0 14px 0;font-size:18px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px;font-weight:600;}
  .field input[type=text], .field input[type=number], .field input[type=url]{width:100%;padding:10px 11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;font-family:inherit;}
  .photo-pick{display:flex;gap:10px;align-items:center;margin-bottom:12px;}
  .photo-preview{width:84px;height:84px;border-radius:10px;overflow:hidden;background:var(--chip);flex:none;display:flex;align-items:center;justify-content:center;font-size:26px;opacity:.5;}
  .photo-preview img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-pick-btn{position:relative;flex:1;padding:10px;border-radius:10px;border:1.5px dashed var(--line);text-align:center;font-size:13.5px;color:var(--sub);cursor:pointer;}
  .photo-pick-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .btn-row{display:flex;gap:10px;margin-top:6px;}
  .btn{flex:1;padding:12px;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer;}
  .btn.primary{background:var(--accent);color:var(--accent-ink);}
  .btn.ghost{background:var(--chip);color:var(--ink);}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px;}
  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13.5px;z-index:70;box-shadow:var(--shadow);}
</style>
</head>
<body>

<header>
  <div class="row">
    <h1>🛍️ Wishlist <span id="countTag"></span></h1>
    <button class="icon-btn" id="addFab2" title="Add product">+</button>
  </div>
  <div class="search">
    <input type="text" id="searchInput" placeholder="Search products…">
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="big">🛍️</div>
    <div>No products yet. Tap + to add one you saw online.</div>
  </div>
</main>

<button class="fab" id="addFab">+</button>

<div class="totalbar" id="totalBar" style="display:none;">
  <div>
    <div class="label" id="totalLabel">0 selected</div>
    <div class="amount" id="totalAmount">$0.00</div>
  </div>
</div>

<div id="modalRoot"></div>

<script>
/* ---------- Storage ---------- */
const STORE_KEY = 'wishlistItems';
let items = load();
let searchQuery = '';
let editingId = null;
let currentPhoto = null;

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function save(){
  localStorage.setItem(STORE_KEY, JSON.stringify(items));
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function fmtMoney(n){ return '$' + (Math.round(n*100)/100).toFixed(2); }

/* ---------- Render ---------- */
function render(){
  renderGrid();
  renderTotal();
}

function filteredItems(){
  if(!searchQuery) return items;
  const q = searchQuery.toLowerCase();
  return items.filter(it => `${it.name||''}`.toLowerCase().includes(q));
}

function renderGrid(){
  const list = filteredItems();
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  document.getElementById('countTag').textContent = items.length ? `· ${items.length}` : '';

  if(items.length === 0){
    grid.innerHTML=''; empty.style.display='block';
    empty.querySelector('.big').textContent = '🛍️';
    empty.querySelector('div:last-child').textContent = 'No products yet. Tap + to add one you saw online.';
    return;
  }
  if(list.length === 0){
    grid.innerHTML=''; empty.style.display='block';
    empty.querySelector('.big').textContent = '🔍';
    empty.querySelector('div:last-child').textContent = 'No products match your search.';
    return;
  }
  empty.style.display='none';

  grid.innerHTML = list.map(it=>{
    const photoStyle = it.photo ? `style="background-image:url('${it.photo}')"` : '';
    return `
    <div class="card ${it.included===false?'off':''}" data-id="${it.id}">
      <div class="toggle-wrap"><input type="checkbox" data-action="toggle" ${it.included!==false?'checked':''}></div>
      <div class="photo ${it.photo?'':'empty'}" ${photoStyle} data-action="view-photo"></div>
      <div class="body">
        <div class="name">${escapeHtml(it.name||'Untitled product')}</div>
        <div class="price">${fmtMoney(it.price||0)}</div>
        ${it.url ? `<a class="link" href="${escapeAttr(it.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(it.url.replace(/^https?:\/\//,''))}</a>` : ''}
        <div class="card-actions">
          <button data-action="edit">Edit</button>
          <button data-action="delete" class="danger">Delete</button>
        </div>
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.card').forEach(card=>{
    const id = card.getAttribute('data-id');
    card.querySelector('[data-action="edit"]').onclick = ()=>openForm(id);
    card.querySelector('[data-action="delete"]').onclick = ()=>confirmDelete(id);
    card.querySelector('[data-action="toggle"]').onchange = (e)=>{
      const it = items.find(x=>x.id===id);
      it.included = e.target.checked;
      save();
      card.classList.toggle('off', !it.included);
      renderTotal();
    };
    const photoEl = card.querySelector('[data-action="view-photo"]');
    photoEl.onclick = ()=>{
      const it = items.find(x=>x.id===id);
      if(it && it.photo) openLightbox(it.photo);
    };
  });
}

function renderTotal(){
  const bar = document.getElementById('totalBar');
  if(items.length === 0){ bar.style.display='none'; return; }
  bar.style.display='flex';
  const included = items.filter(it=>it.included!==false);
  const total = included.reduce((sum,it)=> sum + (Number(it.price)||0), 0);
  document.getElementById('totalLabel').textContent = `${included.length} of ${items.length} selected`;
  document.getElementById('totalAmount').textContent = fmtMoney(total);
}

/* ---------- Search ---------- */
document.getElementById('searchInput').addEventListener('input', e=>{
  searchQuery = e.target.value;
  renderGrid();
});

/* ---------- Lightbox ---------- */
function openLightbox(photo){
  const root = document.getElementById('modalRoot');
  const div = document.createElement('div');
  div.className = 'lightbox';
  div.innerHTML = `<img src="${photo}">`;
  div.onclick = ()=> div.remove();
  root.appendChild(div);
}

/* ---------- Delete ---------- */
function confirmDelete(id){
  const it = items.find(x=>x.id===id);
  if(!it) return;
  if(!confirm(`Delete "${it.name||'this product'}"?`)) return;
  items = items.filter(x=>x.id!==id);
  save();
  render();
  toast('Product deleted');
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg){
  const root = document.getElementById('modalRoot');
  let el = document.getElementById('toastEl');
  if(el) el.remove();
  el = document.createElement('div');
  el.id = 'toastEl';
  el.className = 'toast';
  el.textContent = msg;
  root.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.remove(), 2000);
}

/* ---------- Add / Edit form ---------- */
document.getElementById('addFab').onclick = ()=> openForm(null);
document.getElementById('addFab2').onclick = ()=> openForm(null);

function openForm(id){
  document.getElementById('formOverlay')?.remove();

  editingId = id;
  const it = id ? items.find(x=>x.id===id) : null;
  currentPhoto = it ? (it.photo || null) : null;

  const root = document.getElementById('modalRoot');
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'formOverlay';
  overlay.innerHTML = `
    <div class="sheet">
      <h2>${it ? 'Edit Product' : 'New Product'}</h2>

      <div class="photo-pick">
        <div class="photo-preview" id="photoPreview">${currentPhoto ? `<img src="${currentPhoto}">` : '🛍️'}</div>
        <label class="photo-pick-btn">
          Choose photo
          <input type="file" accept="image/*" id="photoInput">
        </label>
      </div>

      <div class="field">
        <label>Product name</label>
        <input type="text" id="fieldName" placeholder="e.g. Wireless Headphones" value="${it ? escapeAttr(it.name||'') : ''}">
      </div>

      <div class="field">
        <label>Price</label>
        <input type="number" id="fieldPrice" inputmode="decimal" step="0.01" min="0" placeholder="0.00" value="${it && it.price!=null ? it.price : ''}">
      </div>

      <div class="field">
        <label>Link (optional)</label>
        <input type="url" id="fieldUrl" placeholder="https://…" value="${it ? escapeAttr(it.url||'') : ''}">
      </div>

      <div class="btn-row">
        <button class="btn ghost" id="cancelBtn">Cancel</button>
        <button class="btn primary" id="saveBtn">Save</button>
      </div>
    </div>
  `;
  root.appendChild(overlay);

  overlay.addEventListener('click', e=>{ if(e.target === overlay) overlay.remove(); });
  document.getElementById('cancelBtn').onclick = ()=> overlay.remove();
  document.getElementById('saveBtn').onclick = saveForm;
  document.getElementById('photoInput').onchange = handlePhotoChange;
}

function handlePhotoChange(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  resizeImageFile(file, 900, 0.82).then(dataUrl=>{
    currentPhoto = dataUrl;
    document.getElementById('photoPreview').innerHTML = `<img src="${currentPhoto}">`;
  });
}

function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = ()=>{
      img.onload = ()=>{
        let {width,height} = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim/width); width = maxDim; }
          else { width = Math.round(width * maxDim/height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function saveForm(){
  const name = document.getElementById('fieldName').value.trim();
  const price = parseFloat(document.getElementById('fieldPrice').value) || 0;
  const url = document.getElementById('fieldUrl').value.trim();

  if(!name){
    document.getElementById('fieldName').focus();
    return;
  }

  if(editingId){
    const it = items.find(x=>x.id===editingId);
    it.name = name;
    it.price = price;
    it.url = url;
    it.photo = currentPhoto;
  }else{
    items.push({
      id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)),
      name, price, url, photo: currentPhoto, included: true
    });
  }

  save();
  document.getElementById('formOverlay').remove();
  render();
  toast(editingId ? 'Product updated' : 'Product added');
}

/* ---------- Init ---------- */
render();
</script>
</body>
</html>
