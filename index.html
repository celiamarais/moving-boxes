<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wishlist Ledger</title>
<style>
  :root{
    --paper:#eef0e8; --card:#fffdf7; --ink:#1c2016; --sub:#6d7263; --line:#dde1d3;
    --accent:#a8761e; --accent-ink:#fff8ea; --danger:#a3402f; --shadow:0 1px 2px rgba(20,20,10,.06), 0 6px 20px rgba(20,20,10,.05);
    --font-display:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --font-mono:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#15170f; --card:#1e2116; --ink:#eeeadb; --sub:#9a9c86; --line:#32361f;
      --accent:#d9a949; --accent-ink:#1c1300; --danger:#e88370;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 6px 24px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --paper:#15170f; --card:#1e2116; --ink:#eeeadb; --sub:#9a9c86; --line:#32361f;
    --accent:#d9a949; --accent-ink:#1c1300; --danger:#e88370;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 6px 24px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--accent);color:var(--accent-ink);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:18px 20px calc(12px + env(safe-area-inset-top,0)) 20px;}
  header .row{display:flex;align-items:baseline;gap:12px;}
  header h1{font-family:var(--font-display);font-weight:600;font-size:26px;margin:0;flex:1;letter-spacing:-.01em;text-wrap:balance;}
  header .count{font-family:var(--font-mono);font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;}
  .icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:19px;color:var(--ink);flex:none;line-height:1;}
  .icon-btn:active{transform:scale(.94);}
  .search{margin-top:12px;position:relative;}
  .search input{width:100%;padding:8px 4px 9px 4px;border:none;border-bottom:1.5px solid var(--line);background:transparent;color:var(--ink);font-size:15px;font-family:var(--font-body);}
  .search input::placeholder{color:var(--sub);}
  .search input:focus{outline:none;border-bottom-color:var(--accent);}

  main{padding:20px 20px 130px 20px;max-width:980px;margin:0 auto;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:3px;overflow:visible;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative;transition:opacity .18s;}
  .card.off{opacity:.48;}
  .card .photo{aspect-ratio:1/1;background:var(--paper) center/cover no-repeat;position:relative;cursor:pointer;border-bottom:1px solid var(--line);}
  .card .photo.empty::after{content:"🏷️";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;opacity:.35;}

  .toggle-wrap{position:absolute;top:-9px;left:-9px;z-index:2;}
  .toggle-wrap input{appearance:none;-webkit-appearance:none;width:26px;height:26px;margin:0;border-radius:50%;border:2px solid var(--sub);background:var(--card);cursor:pointer;box-shadow:var(--shadow);position:relative;}
  .toggle-wrap input:checked{border-color:var(--accent);background:var(--accent);}
  .toggle-wrap input:checked::after{content:'';position:absolute;inset:7px;border-radius:50%;background:var(--card);}
  .toggle-wrap input:hover{border-color:var(--accent);}

  .card .body{padding:12px 14px 14px 14px;display:flex;flex-direction:column;gap:5px;flex:1;}
  .card .name{font-family:var(--font-display);font-size:16.5px;font-weight:600;line-height:1.28;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:1.28em;text-wrap:balance;}
  .card .price{font-family:var(--font-mono);font-size:17px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;}
  .card .link{font-size:11.5px;color:var(--sub);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:1px dotted var(--line);padding-bottom:1px;width:fit-content;max-width:100%;}
  .card .link:hover{color:var(--accent);border-bottom-color:var(--accent);}

  .card-actions{display:flex;gap:6px;margin-top:auto;padding-top:8px;}
  .card-actions button{flex:1;padding:7px;border-radius:3px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:12px;font-family:var(--font-body);cursor:pointer;letter-spacing:.01em;}
  .card-actions button:hover{border-color:var(--sub);}
  .card-actions button.danger{color:var(--danger);border-color:var(--danger);opacity:.75;}
  .card-actions button.danger:hover{opacity:1;}

  .empty-state{text-align:center;padding:70px 20px;color:var(--sub);}
  .empty-state .big{font-size:36px;margin-bottom:12px;opacity:.7;}
  .empty-state .lead{font-family:var(--font-display);font-size:17px;color:var(--ink);margin-bottom:4px;}

  .fab{position:fixed;right:20px;bottom:calc(96px + env(safe-area-inset-bottom,0));width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:none;font-size:26px;box-shadow:var(--shadow);cursor:pointer;z-index:30;font-family:var(--font-body);}
  .fab:active{transform:scale(.94);}

  .totalbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px dashed var(--line);padding:14px 22px calc(14px + env(safe-area-inset-bottom,0)) 22px;z-index:25;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .totalbar::before,.totalbar::after{content:'';position:absolute;top:-11px;width:22px;height:22px;border-radius:50%;background:var(--paper);}
  .totalbar::before{left:-11px;}
  .totalbar::after{right:-11px;}
  .totalbar .label{font-size:11.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.07em;}
  .totalbar .amount{font-family:var(--font-mono);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;}

  .overlay{position:fixed;inset:0;background:rgba(15,15,10,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
  @media (min-width:640px){.overlay{align-items:center;}}
  .sheet{background:var(--paper);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;border-radius:10px 10px 0 0;padding:22px 22px calc(20px + env(safe-area-inset-bottom,0)) 22px;border-top:1px solid var(--line);}
  @media (min-width:640px){.sheet{border-radius:6px;max-height:85vh;border-top:none;}}
  .sheet h2{font-family:var(--font-display);margin:0 0 18px 0;font-size:21px;font-weight:600;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:11px;color:var(--sub);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;}
  .field input[type=text], .field input[type=number], .field input[type=url]{width:100%;padding:8px 2px;border:none;border-bottom:1.5px solid var(--line);background:transparent;color:var(--ink);font-size:16px;font-family:var(--font-body);}
  .field input:focus{outline:none;border-bottom-color:var(--accent);}
  .field input#fieldPrice{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}

  .photo-pick{display:flex;gap:12px;align-items:center;margin-bottom:18px;}
  .photo-preview{width:76px;height:76px;border-radius:3px;overflow:hidden;background:var(--card);border:1px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:24px;opacity:.6;}
  .photo-preview img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-pick-btn{position:relative;flex:1;padding:11px;border-radius:3px;border:1.5px dashed var(--line);text-align:center;font-size:13px;color:var(--sub);cursor:pointer;letter-spacing:.02em;}
  .photo-pick-btn:hover{border-color:var(--accent);color:var(--accent);}
  .photo-pick-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}

  .btn-row{display:flex;gap:10px;margin-top:8px;}
  .btn{flex:1;padding:12px;border-radius:3px;border:1px solid transparent;font-size:14.5px;font-weight:600;cursor:pointer;font-family:var(--font-body);letter-spacing:.01em;}
  .btn.primary{background:var(--accent);color:var(--accent-ink);}
  .btn.primary:hover{opacity:.92;}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);}
  .btn.ghost:hover{border-color:var(--sub);}

  .lightbox{position:fixed;inset:0;background:rgba(10,10,6,.88);z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:4px;}

  .toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:3px;font-size:13px;z-index:70;box-shadow:var(--shadow);}

  @media (prefers-reduced-motion: reduce){
    .card, .fab, .icon-btn{transition:none;}
  }
</style>
</head>
<body>

<header>
  <div class="row">
    <h1>Wishlist Ledger</h1>
    <span class="count" id="countTag"></span>
    <button class="icon-btn" id="addFab2" title="Add product" aria-label="Add product">+</button>
  </div>
  <div class="search">
    <input type="text" id="searchInput" placeholder="Search your wishlist…">
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="big">🏷️</div>
    <div class="lead">Nothing saved yet</div>
    <div>Tap + to add the first thing you spotted online.</div>
  </div>
</main>

<button class="fab" id="addFab" aria-label="Add product">+</button>

<div class="totalbar" id="totalBar" style="display:none;">
  <div>
    <div class="label" id="totalLabel">0 selected</div>
    <div class="amount" id="totalAmount">$0.00</div>
  </div>
</div>

<div id="modalRoot"></div>

<script>
/* ---------- Storage ---------- */
const STORE_KEY = 'wishlistItems';
let items = load();
let searchQuery = '';
let editingId = null;
let currentPhoto = null;

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function save(){
  localStorage.setItem(STORE_KEY, JSON.stringify(items));
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function fmtMoney(n){ return '$' + (Math.round(n*100)/100).toFixed(2); }

/* ---------- Render ---------- */
function render(){
  renderGrid();
  renderTotal();
}

function filteredItems(){
  if(!searchQuery) return items;
  const q = searchQuery.toLowerCase();
  return items.filter(it => `${it.name||''}`.toLowerCase().includes(q));
}

function renderGrid(){
  const list = filteredItems();
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  document.getElementById('countTag').textContent = items.length ? `${items.length}` : '';

  if(items.length === 0){
    grid.innerHTML=''; empty.style.display='block';
    empty.querySelector('.big').textContent = '🏷️';
    empty.querySelector('.lead').textContent = 'Nothing saved yet';
    empty.querySelector('div:last-child').textContent = 'Tap + to add the first thing you spotted online.';
    return;
  }
  if(list.length === 0){
    grid.innerHTML=''; empty.style.display='block';
    empty.querySelector('.big').textContent = '🔍';
    empty.querySelector('.lead').textContent = 'No matches';
    empty.querySelector('div:last-child').textContent = 'Try a different search term.';
    return;
  }
  empty.style.display='none';

  grid.innerHTML = list.map(it=>{
    const photoStyle = it.photo ? `style="background-image:url('${it.photo}')"` : '';
    return `
    <div class="card ${it.included===false?'off':''}" data-id="${it.id}">
      <div class="toggle-wrap"><input type="checkbox" data-action="toggle" ${it.included!==false?'checked':''} aria-label="Include in total"></div>
      <div class="photo ${it.photo?'':'empty'}" ${photoStyle} data-action="view-photo"></div>
      <div class="body">
        <div class="name">${escapeHtml(it.name||'Untitled product')}</div>
        <div class="price">${fmtMoney(it.price||0)}</div>
        ${it.url ? `<a class="link" href="${escapeAttr(it.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(it.url.replace(/^https?:\/\//,''))}</a>` : ''}
        <div class="card-actions">
          <button data-action="edit">Edit</button>
          <button data-action="delete" class="danger">Delete</button>
        </div>
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.card').forEach(card=>{
    const id = card.getAttribute('data-id');
    card.querySelector('[data-action="edit"]').onclick = ()=>openForm(id);
    card.querySelector('[data-action="delete"]').onclick = ()=>confirmDelete(id);
    card.querySelector('[data-action="toggle"]').onchange = (e)=>{
      const it = items.find(x=>x.id===id);
      it.included = e.target.checked;
      save();
      card.classList.toggle('off', !it.included);
      renderTotal();
    };
    const photoEl = card.querySelector('[data-action="view-photo"]');
    photoEl.onclick = ()=>{
      const it = items.find(x=>x.id===id);
      if(it && it.photo) openLightbox(it.photo);
    };
  });
}

function renderTotal(){
  const bar = document.getElementById('totalBar');
  if(items.length === 0){ bar.style.display='none'; return; }
  bar.style.display='flex';
  const included = items.filter(it=>it.included!==false);
  const total = included.reduce((sum,it)=> sum + (Number(it.price)||0), 0);
  document.getElementById('totalLabel').textContent = `${included.length} of ${items.length} selected`;
  document.getElementById('totalAmount').textContent = fmtMoney(total);
}

/* ---------- Search ---------- */
document.getElementById('searchInput').addEventListener('input', e=>{
  searchQuery = e.target.value;
  renderGrid();
});

/* ---------- Lightbox ---------- */
function openLightbox(photo){
  const root = document.getElementById('modalRoot');
  const div = document.createElement('div');
  div.className = 'lightbox';
  div.innerHTML = `<img src="${photo}">`;
  div.onclick = ()=> div.remove();
  root.appendChild(div);
}

/* ---------- Delete ---------- */
function confirmDelete(id){
  const it = items.find(x=>x.id===id);
  if(!it) return;
  if(!confirm(`Delete "${it.name||'this product'}"?`)) return;
  items = items.filter(x=>x.id!==id);
  save();
  render();
  toast('Product deleted');
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg){
  const root = document.getElementById('modalRoot');
  let el = document.getElementById('toastEl');
  if(el) el.remove();
  el = document.createElement('div');
  el.id = 'toastEl';
  el.className = 'toast';
  el.textContent = msg;
  root.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.remove(), 2000);
}

/* ---------- Add / Edit form ---------- */
document.getElementById('addFab').onclick = ()=> openForm(null);
document.getElementById('addFab2').onclick = ()=> openForm(null);

function openForm(id){
  document.getElementById('formOverlay')?.remove();

  editingId = id;
  const it = id ? items.find(x=>x.id===id) : null;
  currentPhoto = it ? (it.photo || null) : null;

  const root = document.getElementById('modalRoot');
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'formOverlay';
  overlay.innerHTML = `
    <div class="sheet">
      <h2>${it ? 'Edit Product' : 'New Product'}</h2>

      <div class="photo-pick">
        <div class="photo-preview" id="photoPreview">${currentPhoto ? `<img src="${currentPhoto}">` : '🏷️'}</div>
        <label class="photo-pick-btn">
          Choose photo
          <input type="file" accept="image/*" id="photoInput">
        </label>
      </div>

      <div class="field">
        <label>Product name</label>
        <input type="text" id="fieldName" placeholder="e.g. Wireless Headphones" value="${it ? escapeAttr(it.name||'') : ''}">
      </div>

      <div class="field">
        <label>Price</label>
        <input type="number" id="fieldPrice" inputmode="decimal" step="0.01" min="0" placeholder="0.00" value="${it && it.price!=null ? it.price : ''}">
      </div>

      <div class="field">
        <label>Link (optional)</label>
        <input type="url" id="fieldUrl" placeholder="https://…" value="${it ? escapeAttr(it.url||'') : ''}">
      </div>

      <div class="btn-row">
        <button class="btn ghost" id="cancelBtn">Cancel</button>
        <button class="btn primary" id="saveBtn">Save</button>
      </div>
    </div>
  `;
  root.appendChild(overlay);

  overlay.addEventListener('click', e=>{ if(e.target === overlay) overlay.remove(); });
  document.getElementById('cancelBtn').onclick = ()=> overlay.remove();
  document.getElementById('saveBtn').onclick = saveForm;
  document.getElementById('photoInput').onchange = handlePhotoChange;
}

function handlePhotoChange(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  resizeImageFile(file, 900, 0.82).then(dataUrl=>{
    currentPhoto = dataUrl;
    document.getElementById('photoPreview').innerHTML = `<img src="${currentPhoto}">`;
  });
}

function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = ()=>{
      img.onload = ()=>{
        let {width,height} = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim/width); width = maxDim; }
          else { width = Math.round(width * maxDim/height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function saveForm(){
  const name = document.getElementById('fieldName').value.trim();
  const price = parseFloat(document.getElementById('fieldPrice').value) || 0;
  const url = document.getElementById('fieldUrl').value.trim();

  if(!name){
    document.getElementById('fieldName').focus();
    return;
  }

  if(editingId){
    const it = items.find(x=>x.id===editingId);
    it.name = name;
    it.price = price;
    it.url = url;
    it.photo = currentPhoto;
  }else{
    items.push({
      id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)),
      name, price, url, photo: currentPhoto, included: true
    });
  }

  save();
  document.getElementById('formOverlay').remove();
  render();
  toast(editingId ? 'Product updated' : 'Product added');
}

/* ---------- Init ---------- */
render();
</script>
</body>
</html>
